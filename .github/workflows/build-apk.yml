name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Locate Android project
        run: |
          SETTINGS=$(find . -name settings.gradle -not -path '*/node_modules/*' | while read -r f; do
            d=$(dirname "$f")
            if [ -f "$d/app/build.gradle" ]; then echo "$f"; break; fi
          done)
          if [ -z "$SETTINGS" ]; then
            echo "::error::Could not find an Android project (settings.gradle + app/build.gradle)"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Ensure Gradle properties
        run: |
          PROPS="$PROJECT_DIR/gradle.properties"
          touch "$PROPS"
          grep -q '^org.gradle.jvmargs' "$PROPS" || echo 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' >> "$PROPS"
          grep -q '^android.useAndroidX' "$PROPS" || echo 'android.useAndroidX=true' >> "$PROPS"
          grep -q '^android.enableJetifier' "$PROPS" || echo 'android.enableJetifier=true' >> "$PROPS"
          echo "--- gradle.properties ---"
          cat "$PROPS"

      - name: Ensure ProGuard rules file
        run: |
          PRO="$PROJECT_DIR/app/proguard-rules.pro"
          if [ ! -f "$PRO" ]; then
            echo "# Keep default rules" > "$PRO"
            echo "Created $PRO"
          fi

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Locate built APK
        run: |
          APK=$(find "$PROJECT_DIR" -path '*/outputs/apk/debug/*.apk' | head -n1)
          if [ -z "$APK" ]; then
            echo "::error::APK was not produced"
            exit 1
          fi
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          echo "Built: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daris-app-debug
          path: ${{ env.APK_PATH }}
          retention-days: 14
